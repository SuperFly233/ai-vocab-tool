<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lexi Anki Bridge</title><link rel="stylesheet" href="/assets/style.css"></head><body>
<header class="app-header"><div class="brand"><img src="/assets/favicon.svg" alt=""><strong>Lexi Anki Bridge</strong><span>0.1.0</span></div><div><button id="logout" hidden>退出账号</button><button id="shutdown">退出程序</button></div></header>
<main><section id="login-view"><h1>连接你的学习账号</h1><form id="login"><label>Lexi 邮箱<input name="email" type="email" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form></section>
<div id="workspace" hidden><section class="connection"><div class="section-heading"><h1>场景制卡</h1><span id="connection-status" role="status">未检查 Anki</span></div><form id="config"><label>电脑名称<input name="name" maxlength="80" required></label><label>AnkiConnect 端口<input name="port" type="number" min="1024" max="65535" required></label><label>目标牌库<select name="deck"><option>Lexi 验收</option></select></label><label>本地密钥<input name="key" type="password" autocomplete="off" placeholder="留空保留现有密钥"></label><div class="config-actions"><button type="submit">保存连接</button><button id="diagnose" type="button">检查 Anki</button><button id="register" type="button">登记这台电脑</button></div></form></section>
<div class="workbench"><aside><div class="section-heading"><h2>云端任务</h2><button id="refresh" class="icon" title="刷新任务" aria-label="刷新任务" data-icon="refresh-cw"></button></div><div id="jobs"></div></aside><section id="preview"><div class="empty">选择任务，预览本批卡片</div></section></div></div>
<p id="status" role="status"></p></main><script src="/assets/icons.js"></script><script src="/assets/app.js"></script></body></html>
