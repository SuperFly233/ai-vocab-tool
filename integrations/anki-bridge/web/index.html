<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lexi 连接助手</title><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/bridge-connection.css"></head><body class="connection-helper">
<header class="app-header"><div class="brand"><img src="/assets/favicon.svg" alt=""><strong>Lexi 连接助手</strong><span id="bridge-version">正在核对版本</span></div><div class="header-actions"><button id="logout" hidden>退出账号</button><button id="shutdown">退出程序</button></div></header>
<main><section id="release-guide" aria-label="助手更新"><p>正在核对正式发布…</p></section><section id="login-view"><h1>连接你的学习账号</h1><p>登录同一账号 → 登记电脑 → 检查 Anki → 在 Lexi 网页核对牌库并确认。</p><form id="login"><label>Lexi 邮箱<input name="email" type="email" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form></section>
<div id="workspace" hidden><section class="connection"><div class="section-heading"><h1>设备连接</h1><span id="device-name"></span></div><details class="connection-config"><summary>连接配置</summary><form id="config"><label>电脑名称<input name="name" maxlength="80" required></label><label>AnkiConnect 端口<input name="port" type="number" min="1024" max="65535" required></label><input type="hidden" name="deck" value="Lexi 验收"><label>本地密钥<input name="key" type="password" autocomplete="off" placeholder="留空保留现有密钥"></label><div class="config-actions"><button type="submit">保存连接</button><button id="detect-anki" type="button">读取本机 Anki 连接</button><button id="register" type="button">登记这台电脑</button></div></form></details></section>
<div class="connection-strip"><div id="bridge-diagnostics"></div><button id="diagnostics" class="icon" aria-label="检查连接" data-icon="refresh-cw"></button></div><div class="helper-actions"><a class="helper-web-link" href="https://ai-vocab-tool.pages.dev" target="_blank" rel="noopener noreferrer">打开 Lexi 工作台 <i data-lucide="arrow-up-right"></i></a><button id="pause-worker">暂停接单</button><button id="export-diagnostics">导出诊断</button><a href="https://github.com/SuperFly233/ai-vocab-tool/releases/latest" target="_blank" rel="noopener noreferrer">检查更新</a></div><p id="worker-state" role="status"></p></div>
<p id="status" role="status"></p></main><dialog id="confirm-action"><form method="dialog"><h2>确认读取连接</h2><p>读取本机 AnkiConnect 的端口与密钥？密钥只保存在系统凭据库，不上传云端。</p><footer><button value="cancel">取消</button><button value="accept" class="primary">确认读取</button></footer></form></dialog><script src="/assets/icons.js"></script><script src="/assets/bridge-release.js"></script><script src="/assets/connection.js"></script></body></html>
